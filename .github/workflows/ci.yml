name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.x"
  GOFLAGS: "-mod=readonly"

jobs:
  static-guards:
    name: Static guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Verify module state
        shell: bash
        run: |
          go mod verify
          go mod tidy -diff
          # Which module identities may appear at all. This is a supply chain
          # decision and not a licence one: tests/compliance reads the terms of
          # every module that reaches the build, while this says what is allowed to
          # be in the graph, including the ones only the graph carries.
          #
          # The comparison is a diff in both directions on purpose. A module that
          # arrived without a line here is caught, and so is a line left behind by a
          # dependency that went away, because an approved name that nothing uses is
          # a decision nobody is looking at any more.
          cat > /tmp/approved-modules.txt <<'MODULES'
            cloud.google.com/go/compute/metadata
            github.com/SivanCola/windows-sandbox
            github.com/dustin/go-humanize
            github.com/golang-jwt/jwt/v5
            github.com/google/go-cmp
            github.com/google/jsonschema-go
            github.com/google/pprof
            github.com/google/uuid
            github.com/hashicorp/golang-lru/v2
            github.com/mattn/go-isatty
            github.com/modelcontextprotocol/go-sdk
            github.com/ncruces/go-strftime
            github.com/remyoudompheng/bigfft
            github.com/segmentio/asm
            github.com/segmentio/encoding
            github.com/yosida95/uritemplate/v3
            go.yaml.in/yaml/v3
            golang.org/x/exp
            golang.org/x/mod
            golang.org/x/oauth2
            golang.org/x/sync
            golang.org/x/sys
            golang.org/x/time
            golang.org/x/tools
            modernc.org/cc/v4
            modernc.org/ccgo/v4
            modernc.org/fileutil
            modernc.org/gc/v2
            modernc.org/gc/v3
            modernc.org/goabi0
            modernc.org/libc
            modernc.org/mathutil
            modernc.org/memory
            modernc.org/opt
            modernc.org/sortutil
            modernc.org/sqlite
            modernc.org/strutil
            modernc.org/token
          MODULES
          sed -i 's/^ *//' /tmp/approved-modules.txt
          go list -m -f '{{.Path}}' all | tail -n +2 | sort > /tmp/modules.txt
          if ! diff -u /tmp/approved-modules.txt /tmp/modules.txt; then
            printf 'The module set and the approved list disagree. A module with no line is unapproved; a line with no module is stale.\n'
            exit 1
          fi
      - name: Enforce CGO and L1 dependency boundaries
        shell: bash
        run: |
          if find . -name '*.go' -not -path './.git/*' -print0 | xargs -0 grep -nE '(^|[[:space:]])import[[:space:]]+(_[[:space:]]+)?"C"|//[[:space:]]*#cgo'; then
            printf 'CGO usage is forbidden.\n'
            exit 1
          fi
          nonstandard="$(go list -deps -f '{{if and (not .Standard) (not .Module)}}{{.ImportPath}}{{end}}' ./internal/core)"
          if [ -n "$nonstandard" ]; then
            printf 'L1 imports non-standard packages:\n%s\n' "$nonstandard"
            exit 1
          fi
      - name: Run architecture guard tests
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./internal/core

  native-tests:
    name: Native tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The floor is the coverage the platform can reach on a hosted runner.
        # Linux and Windows enforce their backends there, so the floor sits at
        # the measured value. The hosted macOS image cannot enforce a Seatbelt
        # profile at all, so only the profile construction assertions run and the
        # reachable floor is lower; on hardware that does enforce, the same gate
        # still guards the runtime paths against regressions.
        include:
          - os: ubuntu-latest
            sandbox_coverage_floor: "80"
          - os: macos-latest
            sandbox_coverage_floor: "70"
          - os: windows-latest
            sandbox_coverage_floor: "90"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          bwrap --version
      - name: Enable unprivileged user namespaces
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sysctl kernel.unprivileged_userns_clone || true
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns || true
          if ! bwrap --unshare-user-try --ro-bind / / --dev /dev --proc /proc -- /bin/sh -c ':'; then
            printf 'bwrap cannot create a user namespace on this runner\n'
          fi
      - name: Test
        env:
          CGO_ENABLED: "0"
        # The storage engine is left out of the parallel run and given its own below.
        # The pure Go SQLite driver corrupts the Go runtime under memory pressure: it
        # dies inside modernc.org/libc with a nil P in the scheduler, which is not a
        # panic and cannot be recovered. It needs the machine busy, so a package on
        # its own has never done it and a full parallel run does it about one time in
        # six to eight. Running it alone is what removes the condition, and isolating
        # it means the fault is reported against the part that has it instead of
        # taking every other package's result with it.
        run: go test -count=1 $(go list ./... | grep -v '/internal/engine/storage$')
      - name: Test the storage engine on its own
        env:
          CGO_ENABLED: "0"
        # -p 1 because the fault needs a busy machine. This is not a claim that the
        # driver is sound under load, only that a test run is not a way to find out
        # at the cost of everything else.
        run: go test -count=1 -p 1 ./internal/engine/storage
      # The storage suites run without coverage instrumentation for a second reason
      # on top of the one above. Coverage makes the allocator work harder, which is
      # the same pressure, so storage coverage is not a gate while the other packages
      # keep theirs.
      - name: Test the durability suites
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -v -run 'Test(Scope|Recover|Clean|Write|Journal|Audit|Checkpoint|FileLock|Sink)' ./internal/engine/storage
      - name: Test the crash contract
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -v ./tests/durability
      - name: Test the seams between parts
        # These are the promises no single package can keep on its own: a
        # compaction that invalidates the cached prefix, a tool result that
        # reaches the model as untrusted data, and a refused call that still
        # answers the provider. A part can pass alone and break all three.
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -v ./tests/integration
      - name: Check what the build depends on and under what terms
        # AGENTS allows only permissive terms, so the terms are read from each
        # module rather than remembered in a list that drifts.
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -v ./tests/compliance
      - name: Test the context, cache and security parts verbosely
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -v ./internal/engine/context ./internal/engine/cache ./internal/engine/security
      # One part per step, because a bundled step reports one failure for four
      # parts and the other three go unchecked until somebody reads the log.
      - name: Test the subagent part verbosely
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -v ./internal/engine/subagent
      - name: Test the logging part verbosely
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -v ./internal/engine/logging
      - name: Test the language server part verbosely
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -v ./internal/engine/lsp
      - name: Test the wiki part verbosely
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -v ./internal/engine/wiki
      - name: Test the platform package on this host
        env:
          CGO_ENABLED: "0"
        shell: bash
        run: |
          go test -count=1 -v ./internal/engine/platform
          go test -count=1 -coverprofile=platform-coverage.out ./internal/engine/platform
          go tool cover -func=platform-coverage.out
          coverage="$(go tool cover -func=platform-coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v coverage="$coverage" 'BEGIN { if (coverage + 0 < 90.0) exit 1 }'
      # The host differences live in build-tagged files, so a mistake in one of them is
      # invisible until the other system compiles it. Building every promised
      # combination is what makes a broken Unix file show up on a Windows runner.
      - name: Build every promised target
        env:
          CGO_ENABLED: "0"
        shell: bash
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "building $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./...
          done
      - name: Upload platform coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: platform-coverage-${{ matrix.os }}
          path: platform-coverage.out
      - name: Test platform sandbox suites verbosely
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -v -run 'Test(Windows|Linux|Darwin|SandboxBackend)' ./internal/engine/sandbox
      - name: Require a working sandbox backend
        if: runner.os != 'macOS'
        env:
          CGO_ENABLED: "0"
          MARXAGENT_REQUIRE_SANDBOX: "1"
        run: go test -count=1 -run TestSandboxBackendAvailability ./internal/engine/sandbox
      - name: Report sandbox backend enforcement on macOS
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        shell: bash
        run: |
          if go test -count=1 -v -run TestSandboxBackendAvailability ./internal/engine/sandbox | tee /tmp/backend.log | grep -q -- '--- PASS'; then
            printf 'seatbelt enforcement is active on this runner\n'
          else
            printf '::warning::sandbox-exec cannot enforce a profile on this runner; the Seatbelt runtime assertions were skipped and only profile construction is verified\n'
            cat /tmp/backend.log
          fi
      - name: Vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...
      - name: Enforce sandbox coverage floor
        env:
          CGO_ENABLED: "0"
        shell: bash
        run: |
          go test -count=1 -coverprofile=sandbox-coverage.out ./internal/engine/sandbox
          go tool cover -func=sandbox-coverage.out
          coverage="$(go tool cover -func=sandbox-coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          floor="${{ matrix.sandbox_coverage_floor }}"
          awk -v coverage="$coverage" -v floor="$floor" 'BEGIN { if (coverage + 0 < floor + 0) exit 1 }'
      - name: Upload sandbox coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-coverage-${{ matrix.os }}
          path: sandbox-coverage.out
          if-no-files-found: error

  gateway:
    name: Gateway end to end (${{ matrix.format }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        format:
          - openai-completions
          - anthropic-messages
          - openai-responses
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run the ${{ matrix.format }} main path
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -v -run "TestEndToEndAllFormats/${{ matrix.format }}$" ./internal/engine/gateway
      - name: Run the recorded corpora and property tests
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -run "Corpus|TestProperty" ./internal/engine/gateway
      - name: Enforce the gateway coverage floor
        env:
          CGO_ENABLED: "0"
        shell: bash
        run: |
          go test -count=1 -coverprofile=gateway-coverage.out ./internal/engine/gateway
          go tool cover -func=gateway-coverage.out
          coverage="$(go tool cover -func=gateway-coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v coverage="$coverage" 'BEGIN { if (coverage + 0 < 90.0) exit 1 }'

  subagent:
    name: Sub agent confinement and pool
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The rule the sub agent design turns on is that a template, which is a file
      # anybody can write, cannot hand a sub agent the power to direct sub agents.
      # That is checked here on its own rather than left inside the whole part's
      # suite, because it is the one property that must not quietly regress while
      # everything else still passes.
      - name: Check a sub agent cannot direct sub agents
        env:
          CGO_ENABLED: "0"
        run: >
          go test -count=1 -v
          -run "TestATemplateCannotGiveASubAgentThePowerToDirectSubAgents|TestEachTaskGetsItsOwnAgentContextAndLoop"
          ./internal/engine/subagent
      - name: Run the sub agent part under the race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=3 ./internal/engine/subagent
      - name: Enforce the sub agent coverage floor
        env:
          CGO_ENABLED: "0"
        shell: bash
        run: |
          go test -count=1 -coverprofile=subagent-coverage.out ./internal/engine/subagent
          go tool cover -func=subagent-coverage.out
          coverage="$(go tool cover -func=subagent-coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v coverage="$coverage" 'BEGIN { if (coverage + 0 < 90.0) exit 1 }'
      - name: Upload sub agent coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: subagent-coverage
          path: subagent-coverage.out

  cross-builds:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build without CGO
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install bubblewrap
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          bwrap --version
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Run race detector
        env:
          CGO_ENABLED: "1"
        # Storage is excluded here for the same reason it is excluded from the plain
        # run, and the race detector makes the reason worse rather than better: it
        # adds bookkeeping to every allocation, which is the pressure the driver
        # cannot survive.
        run: go test -race -count=1 $(go list ./... | grep -v '/internal/engine/storage$')
      - name: Run race detector on the storage engine alone
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -p 1 ./internal/engine/storage

  coverage:
    name: L1 coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Enforce 100 percent statement coverage
        env:
          CGO_ENABLED: "0"
        shell: bash
        run: |
          go test -count=1 -coverprofile=coverage.out ./internal/core
          go tool cover -func=coverage.out
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v coverage="$coverage" 'BEGIN { if (coverage + 0 < 100.0) exit 1 }'

  performance:
    name: L1 performance gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Enforce latency and memory gates
        env:
          CGO_ENABLED: "0"
          MARXAGENT_PERFORMANCE: "1"
        shell: bash
        run: |
          for gate in 1000_message_snapshot empty_loop 10_hook_trigger 10k_message_agent_memory event_dispatch_p99_with_100_subscribers; do
            go test -run "^TestL1PerformanceGates$/${gate}$" -count=3 ./internal/core
          done
      - name: Record benchmarks
        env:
          CGO_ENABLED: "0"
        shell: bash
        run: |
          go test -run '^$' -benchtime=10000x -count=1 -bench '^BenchmarkEventBusPublish100Subscribers$' ./internal/core
          go test -run '^$' -benchtime=500ms -count=1 -bench 'Benchmark(AgentEmptyLoop|StateSnapshot1000Messages|HookTrigger10Hooks|AgentMemory10000Messages)$' ./internal/core
